<script>(function(){var t=null;try{t=localStorage.getItem("ae:tema")}catch(e){}if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";if(!/[?&]export=1/.test(location.search))document.documentElement.setAttribute("data-theme",t)})()</script>
<link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/efeitos.css"><link rel="stylesheet" href="assets/ui.css"><script>try{if(sessionStorage.getItem("pt"))document.documentElement.classList.add("pt-arrive")}catch(e){}</script><style>body.export{background:#fff}body.export .stack{max-width:1080px;padding:0;gap:0}body.export .card{box-shadow:none;border-radius:0}body.export header.top{display:none}header.top a{color:#bfeee6;text-decoration:none;font-size:.95rem}header.top .marca{font-size:1.1rem;margin:10px 0 4px}header.top h1{font-size:1.8rem;margin:0;color:#fff}</style></head><body>

<header class="top ag-host"><div class="ag" aria-hidden="true"></div><div class="wrap"><a href="membros.html">‹ Voltar</a><p class="marca gw">Alongamento Estático</p><h1 id="t" data-blur></h1></div></header>

<script src="assets/guias.js"></script><script src="assets/imagens.js"></script><script src="assets/progresso.js"></script><script src="assets/cards.js"></script><script>
const q=new URLSearchParams(location.search);if(q.get("export"))document.body.classList.add("export");
const g=MODULOS.flatMap(m=>m.guias).find(x=>x.id===q.get("g"));
if(g){document.getElementById("t").textContent=g.titulo;document.getElementById("agenda").setAttribute("data-guia",g.id);renderCards(g,document.getElementById("cards"))}else document.getElementById("cards").textContent="Guia não encontrado.";
const alvo=+q.get("c");if(alvo&&!q.get("export"))setTimeout(()=>{const el=document.querySelector('.card[data-i="'+alvo+'"]');if(el){el.scrollIntoView({behavior:"smooth",block:"center"});const f=el.closest(".flip");if(f)setTimeout(()=>f.classList.add("virado"),700)}},1500);
</script><script src="assets/agenda.js"></script><script src="assets/ui.js"></script><script src="assets/efeitos.js"></script></body></html>
