<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alongamento Estático — Área de Membros</title><script>(function(){var t=null;try{t=localStorage.getItem("ae:tema")}catch(e){}if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.setAttribute("data-theme",t)})()</script>
<link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/efeitos.css"><link rel="stylesheet" href="assets/entrada.css"><link rel="stylesheet" href="assets/capas.css"><link rel="stylesheet" href="assets/ui.css"><script>try{var R=document.documentElement;if(sessionStorage.getItem("pt"))R.classList.add("pt-arrive");else if(!sessionStorage.getItem("entrou")&&!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))R.classList.add("entrada")}catch(e){}</script></head><body>
<script src="assets/carregando.js"></script>
<div id="entrada" role="dialog" aria-label="Entrada" tabindex="0"><canvas aria-hidden="true"></canvas><div class="tx"><h2 class="nome gw">Alongamento Estático</h2><p class="lema">Pausas de 3 minutos para o corpo de quem não para.</p><p class="dica">Toque para entrar</p></div></div>
<header class="top ag-host"><div class="ag" aria-hidden="true"></div><div class="wrap"><h1 class="gw marca">Alongamento Estático</h1><p data-blur style="margin:.3em 0 0;color:#e6f3f1;font-size:1.1rem">Escolha o guia e faça na própria cadeira.</p></div></header>

<div class="busca-nova" id="busca-area">
  <form class="form relative" id="busca" role="search" autocomplete="off" onsubmit="return false">
    <button class="absolute left-2 -translate-y-1/2 top-1/2 p-1 botao-busca" type="submit" aria-label="Buscar">
      <svg width="17" height="16" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="search" class="w-5 h-5 text-gray-700"><path d="M7.667 12.667A5.333 5.333 0 107.667 2a5.333 5.333 0 000 10.667zM14.334 14l-2.9-2.9" stroke="currentColor" stroke-width="1.333" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <input id="q" class="input rounded-full px-8 py-3 border-2 border-transparent focus:outline-none focus:border-blue-500 placeholder-gray-400 transition-all duration-300 shadow-md" placeholder="Buscar exercício..." type="text" aria-label="Buscar exercício">
    <button type="reset" id="filter-icon" class="absolute right-3 -translate-y-1/2 top-1/2 p-1 botao-limpar" aria-label="Limpar busca">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
  </form>
</div>

<section class="wrap" id="agenda"></section>

<section class="wrap" id="progresso"></section>
<main class="wrap" id="modulos"><div id="app"></div></main>
<section class="wrap" id="res" aria-live="polite"></section>
<p class="wrap aviso" id="aviso"></p>
<script src="assets/guias.js"></script><script src="assets/progresso.js"></script><script src="assets/agenda.js"></script><script>
document.getElementById("aviso").textContent=AVISO;
/* Progresso geral e por guia (guardado no aparelho) */
function mostrarProgresso(){
  const [f,t]=AE.geral(MODULOS),p=t?Math.round(f*100/t):0;
  document.getElementById("progresso").innerHTML=`<div class="prog"><b>Seu progresso</b><small>${f} de ${t} exercícios concluídos</small><div class="barra"><i style="width:0"></i></div></div>`;
  setTimeout(()=>{const b=document.querySelector("#progresso .barra i");if(b)b.style.width=p+"%"},120);
}
function textoGuia(g){const [f,t]=AE.guia(g);return t?`${g.cards.length} cards · ${f}/${t} concluídos`:`${g.cards.length} cards`}
/* Capas dos módulos: imagem + zoom lento + brilho; sem imagem usa o gradiente animado */
const CAPAS={1:["capa-modulo-1.jpg","50% 20%"],2:["capa-modulo-2.jpg","50% 30%"],3:["capa-modulo-3.jpg","50% 42%"],4:["capa-modulo-4.jpg","50% 50%"],5:["capa-bonus.jpg","50% 32%"]};
function capaMod(m){
  const partes=m.nome.split(" — "),kick=partes.length>1?partes[0]:"",titulo=partes.length>1?partes[1]:m.nome,c=CAPAS[m.id];
  const fundo=c?`<div class="fundo"><img src="assets/img/${c[0]}" alt="" style="--pos:${c[1]}" loading="lazy"></div>`:`<div class="fundo"><div class="ag" aria-hidden="true"></div></div>`;
  return `<div class="capa-mod${c?"":" sem-img"}">${fundo}<div class="veu"></div><div class="brilho"></div><div class="txt"><div class="kick">${kick}</div><h2>${titulo}</h2><span class="chip">${m.guias.length} guias</span></div></div>`;
}
function listar(){document.getElementById("app").innerHTML=MODULOS.map(m=>`<div class="mod">${capaMod(m)}${m.guias.map(g=>`<a class="guia" href="guia.html?g=${g.id}"><span>${g.titulo}<br><small>${textoGuia(g)}</small></span><b>${g.tempo} ›</b></a>`).join("")}</div>`).join("")}
listar();mostrarProgresso();
window.addEventListener("pageshow",e=>{if(e.persisted){listar();mostrarProgresso();if(window.renderAgenda)renderAgenda()}});

/* Busca: guias e exercícios, sem diferenciar acentos nem maiúsculas */
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const indice=[];
MODULOS.forEach(m=>m.guias.forEach(g=>{
  indice.push({tipo:"guia",nome:g.titulo,guia:g.titulo,mod:m.nome,href:`guia.html?g=${g.id}`,det:g.tempo,chave:norm(g.titulo)});
  g.cards.forEach((c,i)=>{ if(c.t==="ex") indice.push({tipo:"ex",nome:c.nome,guia:g.titulo,mod:m.nome,href:`guia.html?g=${g.id}&c=${i+1}`,det:c.medida||"",chave:norm(c.nome+" "+c.desc)}); });
}));
const q=document.getElementById("q"),res=document.getElementById("res"),app=document.getElementById("app");
function buscar(){
  const t=norm(q.value.trim());
  if(!t){res.classList.remove("on");res.innerHTML="";app.style.display="";return}
  const achou=indice.filter(x=>t.split(/\s+/).every(p=>x.chave.includes(p)));
  app.style.display="none";res.classList.add("on");
  res.innerHTML=achou.length
    ?`<p class="cont">${achou.length} resultado${achou.length>1?"s":""}</p>`+achou.map(x=>`<a class="guia" href="${x.href}"><span>${esc(x.nome)}<br><small>${x.tipo==="guia"?"Guia completo":esc(x.guia)}${x.det&&x.tipo==="ex"?" · "+esc(x.det):""}</small></span><b>ver ›</b></a>`).join("")
    :`<p class="vazio">Nenhum exercício encontrado para “${esc(q.value.trim())}”.<br>Tente outra palavra, como “lombar” ou “pescoço”.</p>`;
}
q.addEventListener("input",buscar);
document.getElementById("filter-icon").addEventListener("click",()=>{q.value="";buscar();q.focus()});
</script><script src="assets/logo-pontos.js"></script><script src="assets/entrada.js"></script><script src="assets/ui.js"></script><script src="assets/efeitos.js"></script></body></html>
