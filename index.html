<body>
<a class="skip" href="#main">Pular para o conteúdo</a>

<!-- Contador inicial -->
<div class="loader" id="loader" role="progressbar" aria-label="Abrindo o cofre" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div class="loader__count"><span id="loaderNum">0</span><i>%</i></div>
  <div class="loader__bar"><b id="loaderBar"></b></div>
  <p class="loader__txt">Abrindo o cofre</p>
</div>

<div class="announce" id="announce" role="region" aria-label="Avisos da loja"><p id="announceText"></p></div>

<header class="header" id="header">
  <button class="header__icon" id="menuBtn" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="drawer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
  </button>
  <button class="header__icon" id="searchBtn" type="button" aria-label="Buscar" aria-haspopup="dialog" aria-controls="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.2"/></svg>
  </button>
  <a class="logo" href="#/" aria-label="JSD™, página inicial"><span>JSD<sup>™</sup></span><img src="assets/logo.svg" alt="" width="30" height="30"></a>
  <a class="header__icon" href="#/contato" aria-label="Atendimento e contato">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4.5 20c.8-4 3.7-6 7.5-6s6.7 2 7.5 6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
  </a>
  <a class="header__icon" href="#/sacola" id="bagBtn" aria-label="Abrir sacola, 0 itens">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l1 12H4zM9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg><span class="bag-n" id="bagCount" hidden>0</span>
  </a>
</header>

<div class="search" id="search" hidden></div>

<div class="drawer" id="drawer" hidden>
  <div class="drawer__bg" data-close></div>
  <nav class="drawer__panel" id="drawerPanel" aria-label="Menu principal" tabindex="-1"></nav>
</div>

<main id="main" tabindex="-1"></main>

<footer class="footer" id="footer"></footer>

<!-- Assinatura desenhada à mão: aparece na abertura e fica fixa no canto -->
<svg class="sig" id="sig" viewBox="0 0 210 96" aria-hidden="true" focusable="false">
  <path pathLength="1" d="M52 10 L26 12 M44 12 C46 34 42 58 32 68 C25 76 12 74 14 62"/>
  <path pathLength="1" d="M86 24 C72 6 56 28 74 40 C92 52 76 76 60 64"/>
  <path pathLength="1" d="M104 16 C97 42 99 64 103 72 C140 78 160 44 135 22 C124 12 112 12 102 16"/>
  <path pathLength="1" d="M8 78 C60 88 140 86 204 66"/>
</svg>

<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

</body>
</html>
