<title>Da Várzea ao Mundo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: HUD fixa no topo, tela central rolável, navegação fixa embaixo. Visual de placar de estádio à noite, um único tema escuro assumido. */
:root{
  --pitch:#0c1d15; --card:#10281b; --line:#2a4a37; --chalk:#eef1e4; --muted:#9db3a3;
  --gold:#f2c12e; --red:#e5484d; --blue:#4aa3ff; --ok:#46d37a; --ink:#07130d;
  --f-display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;overflow-x:hidden;
  background-color:var(--pitch);
  background-image:repeating-linear-gradient(90deg,transparent 0 48px,rgba(255,255,255,.02) 48px 96px);
  color:var(--chalk);font:15px/1.4 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font-family:inherit}
#hud{flex:none;padding:10px 0 8px;border-bottom:1px solid var(--line)}
.hud-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hud-top>div{min-width:0}
.club{font:700 20px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--muted);font-size:12px}
.money{font:700 18px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.ovr{font:800 40px/.85 var(--f-display);color:var(--gold);text-align:right}
.ovr small{display:block;font:600 9px var(--f-body);letter-spacing:.14em;color:var(--muted);margin-top:3px}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.bar label{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar i{display:block;height:5px;background:var(--line);margin-top:3px}
.bar b{display:block;height:100%;background:var(--c,var(--ok));transition:width .4s}
#main{flex:1;min-height:0;overflow-y:auto;padding:14px 0 18px;-webkit-overflow-scrolling:touch}
#nav{flex:none;display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background-color:var(--pitch)}
#nav button{appearance:none;border:0;background:none;color:var(--muted);padding:12px 4px;min-height:46px;
  font:700 15px var(--f-display);text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
#nav button.on{color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
#nav button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.kicker{font:700 12px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
h1,h2{margin:0;text-wrap:balance}
h2{font:800 30px/1 var(--f-display);text-transform:uppercase;margin-bottom:10px;letter-spacing:.01em}
p{margin:0 0 10px}
.sit{font-size:16px;margin:8px 0 14px}
.muted{color:var(--muted)}
.sec{font:700 13px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.card{border:1px solid var(--line);background-color:var(--card);padding:12px;margin-bottom:10px}
.card.warn{border-color:var(--red);color:#ffd3d4}
.next{display:flex;flex-direction:column;gap:2px}
.next b{font:700 22px/1.1 var(--f-display);text-transform:uppercase}
.next span{color:var(--muted);font-size:12px}
.note{border-left:3px solid var(--gold);padding:3px 10px;margin:0 0 8px;font-size:14px}
.tip{color:var(--muted);font-size:13px;margin:12px 0 0}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2>*{min-width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{appearance:none;display:block;width:100%;border:1px solid var(--line);background-color:var(--card);color:var(--chalk);
  padding:11px 12px;font:600 14px var(--f-body);text-align:left;cursor:pointer;min-height:48px}
.btn:active{background-color:var(--line)}
.btn:focus-visible,.chip input:focus-visible+span,.opt input:focus-visible+div{outline:2px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
.btn .t{display:block;font:700 18px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.btn .d{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-weight:400}
.btn.primary{margin-top:14px;background-color:var(--gold);border-color:var(--gold);color:var(--ink);text-align:center;
  font:800 20px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.btn.ghost{margin-top:10px;text-align:center;color:var(--muted)}
.btn.danger{border-color:var(--red)}
.attr{display:grid;grid-template-columns:100px 1fr 30px;gap:10px;align-items:center;margin-bottom:8px;font-size:14px}
.attr i{display:block;height:8px;background:var(--line)}
.attr b{display:block;height:100%;background:var(--gold)}
.attr em{font:700 18px var(--f-display);font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat div{border:1px solid var(--line);background-color:var(--card);padding:8px;text-align:center}
.stat b{display:block;font:800 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.hero{position:relative;height:min(calc(100svh - 28px),900px);min-height:560px;overflow:hidden;margin:-14px 0 0;background:linear-gradient(#5f9de0,#a9cdf0 46%,#e6eef2 66%)}
.hero svg.bg{position:absolute;inset:0;width:100%;height:100%}
.hero .pl{position:absolute;left:50%;bottom:5.4%;height:58%;transform:translateX(-50%);filter:drop-shadow(0 10px 8px rgba(0,0,0,.35));pointer-events:none}
.hero .logo{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 18px);display:flex;align-items:flex-start;gap:12px;z-index:3}
.hero .badge{flex:none;width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.hero .badge svg{width:36px;height:36px}
.hero h1.lg{margin:0;color:#fff;white-space:nowrap;font:italic 900 clamp(34px,11.4vw,52px)/.88 var(--f-display);text-transform:uppercase;letter-spacing:-.01em;text-shadow:0 3px 14px rgba(8,30,70,.35)}
.hero h1.lg em{display:block;font-style:italic;color:var(--gold)}
.hero .tag{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 92px);font:700 12px var(--f-display);letter-spacing:.28em;text-transform:uppercase;color:#fff;opacity:.92;z-index:3;text-shadow:0 1px 6px rgba(8,30,70,.5)}
.hero .shd{position:absolute;left:50%;bottom:10.4%;width:46%;height:3.2%;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(20,30,10,.45),transparent);filter:blur(2px)}
.hero .cta{position:absolute;left:16px;right:16px;bottom:16px;z-index:4;display:grid;gap:8px}
.hero .cta .btn{margin:0;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.hero.ka{background:radial-gradient(120% 80% at 50% 0%,#5b1fd0 0%,#2a0b6b 55%,#14063a 100%)}
.ka .kabg{position:absolute;inset:0;width:100%;height:100%}
.ka .kb{animation:kbf 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes kbf{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3%) scale(1.06)}}
.ka .p1,.ka .p2{position:absolute;bottom:13%;height:52%;pointer-events:none;filter:drop-shadow(0 12px 14px rgba(0,0,0,.45));z-index:2;animation:kap 5s ease-in-out infinite}
.ka .p1{left:-16%}.ka .p2{right:-18%;animation-delay:-2.5s}
@keyframes kap{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ka .kalogo{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8%);text-align:center;z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;animation:kal .9s cubic-bezier(.2,1.2,.3,1) both}
@keyframes kal{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.ka .kab{width:84px;height:84px;border-radius:50%;background:#0a0a8f;display:grid;place-items:center;box-shadow:0 0 0 4px #ffe600,0 10px 30px rgba(0,0,0,.45)}
.ka .kab svg{width:62px;height:62px}
.ka .kalogo h1{margin:0;color:#fff;font:italic 900 clamp(34px,11vw,50px)/.9 var(--f-display);text-transform:uppercase;text-shadow:0 4px 0 #0a0a8f,0 8px 22px rgba(0,0,0,.5)}
.ka .kalogo h1 em{display:block;color:#ffe600;font-style:italic}
.ka .kalogo i{font:700 12px var(--f-display);letter-spacing:.3em;text-transform:uppercase;color:#fff;background:rgba(10,10,143,.7);padding:5px 12px;border-radius:99px}
/* abertura (vinheta) */
#intro{position:fixed;inset:0;z-index:99999;overflow:hidden;font-family:var(--f-display);cursor:pointer}
#intro .st{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .25s}
#intro .st.on{opacity:1}
#intro .gl{position:absolute;left:-100%;height:7%;background:#ffe600;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#intro .sl{position:relative;z-index:2;color:#0a0a8f;background:#ffe600;font:italic 900 clamp(26px,9vw,44px)/1 var(--f-display);padding:10px 18px;text-transform:uppercase;transform:skewX(-8deg);box-shadow:8px 8px 0 #0a0a8f}
#intro .lg{text-align:center;color:#ffe600;font:italic 900 clamp(40px,13vw,64px)/.9 var(--f-display);text-transform:uppercase;animation:kal .8s cubic-bezier(.2,1.2,.3,1) both}
#intro .lg b{display:block;width:96px;height:96px;margin:0 auto 14px;border-radius:50%;background:#ffe600}
#intro .lg b svg{width:100%;height:100%}
.hero .fl{animation:hfl 7s ease-in-out infinite}.hero .fl2{animation:hfl 9s ease-in-out -3s infinite}
@keyframes hfl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.hero .cl{animation:hcl 60s linear infinite}
@keyframes hcl{from{transform:translateX(-30px)}to{transform:translateX(60px)}}
.hero .pn{animation:hpn 38s linear infinite}
@keyframes hpn{from{transform:translateX(420px)}to{transform:translateX(-520px)}}
.setup{display:none;padding:14px 16px 0}.setup.on{display:block}
.setup h2{font:800 30px var(--f-display);text-transform:uppercase;margin:6px 0 4px}
.title{position:relative;padding-top:6px}
.title .circle{position:absolute;right:-70px;top:-20px;width:230px;height:230px;border:2px solid var(--line);border-radius:50%;pointer-events:none}
.title h1{position:relative;font:800 clamp(58px,20vw,96px)/.86 var(--f-display);text-transform:uppercase;margin:6px 0 14px}
.title h1 em{font-style:normal;color:var(--gold)}
.title p{position:relative}
label.f{display:block;font:700 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
input[type=text]{width:100%;background-color:var(--card);color:var(--chalk);border:1px solid var(--line);padding:12px;font:600 16px var(--f-body);border-radius:0}
input[type=text]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{position:relative;display:block}
.chip input,.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:block;padding:12px 6px;border:1px solid var(--line);background-color:var(--card);text-align:center;font:700 17px var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.chip input:checked+span{background-color:var(--gold);color:var(--ink);border-color:var(--gold)}
.opt{position:relative;display:block;margin-bottom:8px}
.opt div{border:1px solid var(--line);background-color:var(--card);padding:10px 12px}
.opt b{display:block;font:700 18px var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.opt span{font-size:13px;color:var(--muted)}
.opt input:checked+div{border-color:var(--gold);box-shadow:inset 4px 0 0 var(--gold)}
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;border:1px solid var(--line);background-color:var(--card);padding:12px}
.sb .tm{font:700 14px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;min-width:0;overflow-wrap:break-word}
.sb .tm:last-child{text-align:right}
.sb .n{font:800 44px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.feed{font-size:13px;color:var(--muted);margin-top:8px}
.min{font:700 14px var(--f-display);color:var(--gold);letter-spacing:.14em;text-transform:uppercase;margin:14px 0 2px}
.goal{font:800 64px/1 var(--f-display);color:var(--gold);text-transform:uppercase;margin-top:14px;animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.track{position:relative;height:42px;background-color:#091510;border:1px solid var(--line);margin:16px 0;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background-color:rgba(70,211,122,.28);border-left:2px solid var(--ok);border-right:2px solid var(--ok)}
.cur{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background-color:var(--gold)}
.rating{font:800 56px/1 var(--f-display);color:var(--gold)}
.chips2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.chip2{appearance:none;border:1px solid var(--line);background-color:var(--card);color:var(--chalk);padding:12px 4px;font:700 16px var(--f-display);text-transform:uppercase;cursor:pointer;min-height:46px}
.chip2.on{background-color:var(--gold);color:var(--ink);border-color:var(--gold)}
.chip2.red.on{background-color:var(--red);border-color:var(--red);color:#fff}
.chip2.black.on{background-color:#000;border-color:var(--chalk);color:#fff}
.chip2.green.on{background-color:var(--ok);border-color:var(--ok);color:var(--ink)}
.chip2.c3{grid-column:auto}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tag{display:inline-block;font:700 11px var(--f-display);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);padding:2px 6px;color:var(--muted)}
.tag.on{border-color:var(--gold);color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font:700 11px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.scroll-x{overflow-x:auto}
.log div{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.cv{display:block;width:100%;max-width:440px;aspect-ratio:360/420;margin:8px auto;border:1px solid var(--line);touch-action:none;background-color:#14301f;cursor:crosshair}
.cv3w{position:relative;max-width:440px;margin:8px auto}
.cv3w::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 50px rgba(0,0,0,.28),inset 0 -40px 60px rgba(0,10,20,.12)}
.cv3w .cv3{filter:contrast(1.04) saturate(1.06) brightness(1.02)}
/* placar sobre o campo (estilo transmissão de jogo mobile) */
.hud3{position:absolute;left:8px;top:8px;display:flex;align-items:stretch;z-index:4;pointer-events:none;font:800 20px/1 'Barlow Condensed',Impact,sans-serif;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.hud3 .hm{background:#0b0b0e;color:#fff;padding:7px 9px;border-radius:7px 0 0 7px;min-width:44px;text-align:center;letter-spacing:.02em}
.hud3 .hs{min-width:34px;padding:7px 6px;text-align:center;border:2px solid #fff;border-radius:6px;margin-left:-1px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.55)}
.hud3 .hd{background:#0b0b0e;color:#fff;padding:7px 3px}
.hud3 .hn{align-self:center;margin-left:8px;color:#fff;font-size:13px;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 3px #000,0 0 6px #000;opacity:.95}
body:has(.hud3) .sb,body:has(.hud3) .min{display:none}
.cv3{display:block;width:100%;aspect-ratio:360/460;touch-action:none;border:1px solid var(--line);background:#0a1220;cursor:crosshair}
.trl{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.actbar.ckbar{position:absolute;left:8px;right:8px;bottom:10px;top:auto;flex-direction:row;justify-content:center;align-items:center;gap:8px}
.ckbar .abtn{width:auto;height:54px;border-radius:14px;padding:0 14px;font-size:13px;background:rgba(229,72,77,.9)}
.cv3t{position:absolute;left:0;right:0;top:8%;text-align:center;font:800 46px/1 'Barlow Condensed',Impact,sans-serif;color:#eef1e4;text-shadow:0 3px 0 #000,0 0 14px rgba(0,0,0,.7);pointer-events:none;opacity:0;letter-spacing:1px}
.cv3t.on{animation:cv3pop .45s ease-out forwards}.cv3t.gold{color:var(--gold)}
@keyframes cv3pop{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
.cvwrap{position:relative;width:100%;max-width:440px;margin:8px auto;touch-action:none}
.cvwrap .cv{margin:0}
.cv3w .joy{left:12px;bottom:14px}
.joy{position:absolute;left:12px;bottom:14px;width:112px;height:112px;border-radius:50%;border:2px solid rgba(255,255,255,.48);background:rgba(5,12,9,.28);box-shadow:inset 0 0 0 8px rgba(255,255,255,.06);touch-action:none;user-select:none;-webkit-user-select:none;z-index:3}
.joy:after{content:"";position:absolute;inset:31px;border:1px solid rgba(255,255,255,.17);border-radius:50%}
.joyknob{position:absolute;left:50%;top:50%;width:43px;height:43px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(242,193,46,.88);border:2px solid #fff8d6;box-shadow:0 2px 8px #0008;pointer-events:none;z-index:1}
.joylabel{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font:700 10px var(--f-display);letter-spacing:.12em;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
@media(max-width:380px){.joy{width:96px;height:96px;left:8px;bottom:10px}.joyknob{width:38px;height:38px}}
.actbar{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;align-items:flex-end;gap:9px;z-index:3;user-select:none;-webkit-user-select:none}
.abtn{width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.65);color:#fff;font:800 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 3px #000;box-shadow:0 3px 10px #0009;touch-action:manipulation;cursor:pointer}
.abtn:active{transform:scale(.93)}
.abtn.shoot{width:82px;height:82px;font-size:15px;background:rgba(229,72,77,.88)}
.abtn.pass{background:rgba(46,160,96,.9)}
.abtn.shoot.go{background:rgba(242,193,46,.95);color:#1a1405;text-shadow:none}
.narr{margin:6px 0;padding:7px 10px;border-left:3px solid var(--gold);background:rgba(242,193,46,.08);border-radius:0 8px 8px 0;font-size:13px;line-height:1.35}
.narr b{color:var(--gold)}
.tv3c{aspect-ratio:360/300}
.tvw .tvlow{position:absolute;left:0;right:0;bottom:0}
.tvset{position:relative;height:150px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,#0b2a5b,#123f2e);margin:8px 0}
.tvwall{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 8px;padding:10px;transform:rotate(-6deg) scale(1.3);opacity:.5;font:800 11px/1 var(--f-display);letter-spacing:.12em;color:#cfe3ff;text-align:center}
.tvmic{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:46px;filter:drop-shadow(0 3px 6px #000)}
.tvlow{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(90deg,#f2c12e,#e8a41a);color:#1a1405;padding:6px 10px}
.tvlow b{display:block;font:800 14px/1.1 var(--f-display);text-transform:uppercase}.tvlow small{font-size:11px;display:block;line-height:1.25}
.abtn.shoot.chg,.abtn.pass.chg{animation:chg .85s ease-out forwards}
@keyframes chg{from{box-shadow:0 0 0 0 rgba(242,193,46,.95),0 3px 10px #0009}to{box-shadow:0 0 0 11px rgba(242,193,46,.95),0 3px 10px #0009}}
.abtn.sprint{width:54px;height:54px;font-size:9.5px;letter-spacing:0;background:linear-gradient(0deg,rgba(60,140,230,.95) var(--st,100%),rgba(30,50,90,.8) var(--st,100%))}
.abtn.skill{width:54px;height:54px;font-size:11px;background:rgba(242,193,46,.9);color:#1a1405;text-shadow:none}
.clk{height:5px;background:rgba(0,0,0,.35);margin:6px auto 0;max-width:440px}.clk i{display:block;height:100%;width:100%;background:var(--gold)}

/* ===== abertura: boot, capa e menu ===== */
#boot{position:fixed;inset:0;z-index:200;background:#000;display:grid;place-items:center;transition:opacity .6s}
#boot.out{opacity:0;pointer-events:none}
.bt-ring,.pm-ring{position:relative;width:96px;height:96px;animation:pmspin 14s linear infinite}
.bt-ring{width:150px;height:150px;transition:transform .7s cubic-bezier(.5,0,1,.6),opacity .6s}
.bt-ring i,.pm-ring i{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#d6eeff;
  box-shadow:0 0 8px 2px #7cc4ff,0 0 20px 7px rgba(45,130,255,.6);transform:rotate(calc(var(--i)*45deg)) translateY(-40px);animation:pmd 1.6s linear infinite;animation-delay:calc(var(--i)*-.2s)}
.bt-ring i{width:14px;height:14px;margin:-7px;transform:rotate(calc(var(--i)*45deg)) translateY(-62px)}
#boot .bt-ring i{opacity:0;animation:btin .5s forwards,pmd 1.6s linear infinite;animation-delay:calc(var(--i)*.18s),calc(var(--i)*-.2s + 1.5s)}
#boot.burst .bt-ring{transform:scale(7);opacity:0}
.bt-tx{position:absolute;left:0;right:0;top:calc(50% + 100px);text-align:center;color:#8fa3b8;font:300 13px/1 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.5em;padding-left:.5em;opacity:0;animation:btfade 1.2s 1.4s forwards}
.bt-sk{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;color:#4b5a6a;font:300 11px system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase}
@keyframes pmspin{to{transform:rotate(360deg)}}
@keyframes pmd{0%{opacity:1;transform:rotate(calc(var(--i)*45deg)) translateY(var(--r,-40px)) scale(1.15)}100%{opacity:.18;transform:rotate(calc(var(--i)*45deg)) translateY(var(--r,-40px)) scale(.7)}}
@keyframes btin{to{opacity:1}}
@keyframes btfade{to{opacity:1}}
.bt-ring i{--r:-62px}
/* capa (modelo vitrine de site premiado) */
.cover{position:fixed;inset:0;z-index:60;background:#f7f7f4;color:#151515;overflow-y:auto;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;transition:opacity .45s .2s}
.cover.go{opacity:0;pointer-events:none}.cover.go .cv-card{transform:scale(1.12);filter:brightness(.4)}
.cv-in{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 26px) 18px 44px}
.cv-cap{font-size:15px;color:#333}
.cv-h{margin:22px 0 0;font:800 clamp(38px,12vw,64px)/.95 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:-.04em}
.cv-av{display:flex;justify-content:center;gap:4px;margin:26px 0 30px}
.cv-av span{width:38px;height:38px;border-radius:50%;overflow:hidden;background:#0a0a8f;display:grid;place-items:center;border:2px solid #f7f7f4;margin:0 -2px}
.cv-av span svg{width:30px;height:30px}.cv-av .g{background:#a8ec0a}.cv-av .g img{width:150%;height:150%;object-fit:cover;object-position:50% 12%}
.cv-card{position:relative;aspect-ratio:4/3;border-radius:14px;background:#a8ec0a;overflow:hidden;cursor:pointer;transition:transform .6s cubic-bezier(.4,0,.2,1),filter .6s;-webkit-tap-highlight-color:transparent;text-align:left}
.cv-card:before{content:'';position:absolute;right:-30%;bottom:-48%;width:90%;aspect-ratio:1;border-radius:50%;background:#0fc45c}
.cv-bd{position:absolute;left:12px;top:12px;width:36px;height:36px;border-radius:9px;background:#fff;display:grid;place-items:center;z-index:3}.cv-bd svg{width:26px;height:26px}
.cv-side{position:absolute;z-index:3;font:700 9px/1 system-ui,sans-serif;letter-spacing:.16em;color:#fff;white-space:nowrap}
.cv-side.l{left:10px;top:50%;transform:translate(-50%,-50%) rotate(-90deg);transform-origin:center;margin-left:8px}
.cv-side.r{right:12px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:20% 0}
.cv-side.r u{text-decoration:none;writing-mode:vertical-rl;letter-spacing:.2em}
.cv-sw{position:absolute;right:20%;top:15%;width:20%;z-index:3;animation:pmspin 16s linear infinite}.cv-sw text{font:800 9.5px system-ui,sans-serif;fill:#fff;letter-spacing:.06em}
.cv-card .pa{position:absolute;left:4%;bottom:-2%;height:84%;z-index:1;filter:drop-shadow(0 6px 8px rgba(0,60,0,.35))}
.cv-card .pb{position:absolute;left:40%;bottom:-2%;height:78%;z-index:1;filter:drop-shadow(0 6px 8px rgba(0,60,0,.35))}
.cv-t{position:absolute;left:7%;right:7%;bottom:15%;z-index:2;color:#fff;pointer-events:none}
.cv-t small{display:block;font:700 clamp(10px,3vw,14px) system-ui,sans-serif;letter-spacing:.02em}
.cv-t big{display:block;font:800 clamp(34px,11vw,58px)/.88 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:-.05em;text-shadow:0 2px 0 rgba(0,70,20,.18)}
.cv-t big.b{margin-left:22%}.cv-t em{display:block;margin:4px 0 0 66%;font:800 clamp(11px,3.3vw,15px) system-ui,sans-serif;font-style:normal}
.cv-btn{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);z-index:4;border:1.5px solid #fff;border-radius:9px;padding:8px 22px;box-shadow:0 0 0 3px rgba(255,255,255,.18);color:#fff;font:800 12px system-ui,sans-serif;letter-spacing:.04em;animation:cvp 1.8s ease-in-out infinite}
@keyframes cvp{50%{background:rgba(255,255,255,.22)}}
.cv-p{margin:34px auto 0;font-size:clamp(20px,5.6vw,28px);font-weight:300;line-height:1.38;color:#222;max-width:30ch}
/* menu (modelo de console clássico) */
.pmenu{position:fixed;inset:0;z-index:55;background:#000;display:none;opacity:0;transition:opacity .6s;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.pmenu.on{display:grid;place-items:center}.pmenu.in{opacity:1}
.pm-in{display:flex;align-items:center;gap:34px;padding:0 18px}
.pm-list{list-style:none;margin:0;padding:0}
.pm-list li{padding:7px 0;font-size:17px;font-weight:300;color:#8d96a1;cursor:pointer;transition:color .15s,text-shadow .15s;-webkit-tap-highlight-color:transparent;max-width:210px}
.pm-list li.sel{color:#63b9ff;text-shadow:0 0 12px rgba(80,170,255,.55)}
.pm-hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;justify-content:space-between;padding:0 8%;color:#7d8793;font-size:13px;font-weight:300}
.pm-hint b{display:inline-block;background:#3a3f46;color:#cfd6de;font-size:9px;padding:2px 6px;border-radius:3px;margin-right:6px;font-weight:700}
.pm-how{position:fixed;inset:0;z-index:210;background:rgba(0,0,0,.78);display:grid;place-items:center;padding:20px}
.pm-how>div{max-width:380px;background:#0d1117;border:1px solid #243040;border-radius:12px;padding:20px;color:#c9d3de;font:300 15px/1.45 system-ui,sans-serif}
.pm-how h3{margin:0 0 10px;color:#63b9ff;font-weight:400;letter-spacing:.08em;text-transform:uppercase;font-size:14px}.pm-how p{margin:0 0 10px}.pm-how b{font-weight:600;color:#fff}
/* ===== redesenho: perfil estilo FM / prévia estilo FC ===== */
#hud{background:linear-gradient(180deg,rgba(91,42,158,.34),rgba(12,29,21,0));border-bottom:1px solid rgba(180,140,255,.25)}
.hud-top{align-items:center}
.hud-l{display:flex;align-items:center;gap:10px;min-width:0}
.hud-l svg{flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.dia{position:relative;width:44px;height:44px;flex:none;margin:4px 6px 4px 4px}
.dia:before{content:"";position:absolute;inset:3px;transform:rotate(45deg);border-radius:6px;background:linear-gradient(135deg,#f6d35b,#c88f10);box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.dia span{position:absolute;inset:0;display:grid;place-items:center;font:800 22px var(--f-display);color:#2a1a00}
.dia small{position:absolute;left:0;right:0;bottom:-11px;text-align:center;font:700 8px var(--f-body);letter-spacing:.12em;color:var(--muted)}
.fmhead{position:relative;overflow:hidden;border-radius:16px;padding:14px;display:grid;grid-template-columns:116px 1fr;gap:12px;
  background:radial-gradient(120% 90% at 10% 0%,#7b3fd1 0%,#4a1f95 45%,#210c52 100%);border:1px solid rgba(190,150,255,.35);margin-bottom:12px}
.fmhead .port{width:116px;height:150px;border-radius:12px;object-fit:cover;background:#3a1a78;display:block}
.fmhead h2{font-size:26px;margin:0 0 2px;color:#fff}
.fmhead .pos{font:700 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:#d9c3ff}
.fmgs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 12px}
.fmg{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;border-radius:12px;background:rgba(120,70,210,.22);border:1px solid rgba(190,150,255,.22)}
.fmg i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.14) 0)}
.fmg i b{width:36px;height:36px;border-radius:50%;background:#2a1260;display:grid;place-items:center;font:800 16px var(--f-display);color:#fff}
.fmg span{font:600 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:#cdb8f5}
.fmcard{border-radius:14px;padding:4px 12px;margin-bottom:12px;background:linear-gradient(160deg,rgba(91,42,158,.35),rgba(24,12,56,.55));border:1px solid rgba(190,150,255,.22)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(190,150,255,.15);font-size:14px}
.kv:last-child{border-bottom:0}.kv span{color:#cdb8f5}.kv b{font:700 17px var(--f-display);letter-spacing:.03em;text-align:right}
.fmat{display:grid;grid-template-columns:1fr 38px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(190,150,255,.12)}
.fmat:last-child{border-bottom:0}.fmat span{font-size:14px}
.fmat em{font:800 17px var(--f-display);font-style:normal;text-align:center;border-radius:6px;padding:1px 0;color:#0a1a10;background:var(--c)}
.fmsec{font:700 13px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:#d9c3ff;margin:14px 2px 6px}
.fcn{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 10px;border-radius:16px;margin-bottom:12px;text-align:center;
  background:linear-gradient(100deg,rgba(217,58,63,.28),rgba(20,30,24,.2) 50%,rgba(36,87,197,.3));border:1px solid var(--line)}
.fcn .nm{font:700 15px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.fcn .vs{font:800 24px var(--f-display);color:var(--gold)}
.fcn small{display:block;color:var(--muted);font-size:11px}
.act{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center}
.act .ic{font-size:22px;text-align:center}
.fcp{position:relative;margin:-2px -4px 0;border-radius:18px;overflow:hidden;padding:12px 10px 0;
  background:radial-gradient(70% 60% at 18% 40%,rgba(217,58,63,.55),transparent 70%),radial-gradient(70% 60% at 82% 40%,rgba(36,87,197,.6),transparent 70%),linear-gradient(180deg,#0e1624,#0a1410);border:1px solid var(--line)}
.fcp .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px}
.fcp .top .nm{font:800 17px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.fcp .top .lb{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.fcp .mid{position:relative;display:grid;grid-template-columns:1fr 1fr;margin-top:6px}
.fcp .mid img{width:100%;height:auto;display:block}
.fcp .ctr{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:44%;min-width:150px;display:flex;flex-direction:column;gap:8px;align-items:stretch;z-index:2}
.fcp .ctr .btn{text-align:center;margin:0;border-radius:10px;backdrop-filter:blur(4px)}
.fcp .ctr .btn.primary{margin:0;font-size:17px;padding:12px 8px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.fcp .ctr .vsb{align-self:center;font:800 30px var(--f-display);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.fcp .ctr .tag{text-align:center;font-size:12px;color:#e8ecd8;background:rgba(0,0,0,.45);border-radius:8px;padding:6px}
.fcinfo{display:grid;grid-template-columns:repeat(4,1fr);margin:0 -10px;background:rgba(0,0,0,.55);border-top:1px solid var(--line)}
.fcinfo div{padding:9px 4px;text-align:center;border-right:1px solid rgba(255,255,255,.08)}.fcinfo div:last-child{border-right:0}
.fcinfo span{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fcinfo b{display:block;font:700 14px var(--f-display);margin-top:2px}

/* ===== Central de jogo (estilo carreira FC) ===== */
.cc{--b1:#0f2f9a;--b2:#081a5c;--cy:#59d5ff}
.cc-top{display:flex;align-items:center;gap:10px;margin:-2px 0 10px}
.cc-pl{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:6px 6px 6px 8px;border-radius:30px 0 0 30px;background:linear-gradient(90deg,rgba(10,20,70,.9),rgba(20,50,140,.55))}
.cc-pl b{display:block;font:700 17px/1 var(--f-display);color:#fff;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-pl small{color:#a9bdf5;font-size:12px}
.cc-ovr{flex:none;font:800 30px/1 var(--f-display);color:#fff;padding:6px 18px 6px 22px;background:linear-gradient(90deg,#3b4a8a,#7f93d8);clip-path:polygon(14px 0,100% 0,100% 100%,0 100%)}
.cc-tabs{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:10px;border:1px solid rgba(89,213,255,.25);background:rgba(8,20,80,.8)}
.cc-tabs span{text-align:center;padding:8px 2px;font:700 13px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:#9fb4f0}
.cc-tabs span.on{background:#1647d6;color:#fff;box-shadow:inset 0 -3px 0 var(--cy)}
.cc-main{position:relative;overflow:hidden;padding:14px 14px 12px;margin-bottom:10px;background:linear-gradient(135deg,#1a50e0 0%,#0f2f9a 55%,#0a2070 100%);border:1px solid rgba(89,213,255,.4)}
.cc-main:after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;border:26px solid rgba(255,255,255,.06)}
.cc-main h3{margin:0;font:800 28px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;color:#fff}
.cc-main .dt{font-size:13px;color:#cfe0ff;margin:3px 0 10px}
.cc-vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;position:relative;z-index:1}
.cc-vs .nm{font:700 15px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.05em;color:#fff;margin-top:4px}
.cc-vs small{display:block;color:#bcd0ff;font-size:11px}
.cc-vs .x{font:800 28px var(--f-display);color:#fff}
.cc-go{display:block;width:100%;margin-top:12px;position:relative;z-index:1;appearance:none;border:0;padding:13px;font:800 21px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:#06123e;background:linear-gradient(180deg,#8ee6ff,#3dc3f4);cursor:pointer;min-height:50px}
.cc-go:active{filter:brightness(.9)}
.cc-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.mn{font-style:normal;font:700 10px var(--f-display);letter-spacing:.06em;color:#ff6b72;margin:0 4px;text-transform:uppercase}.lr.out{opacity:.45}.lr.out .nn{text-decoration:line-through}
.cc-p{padding:12px;background:linear-gradient(160deg,#0d2a86,#081a5c);border:1px solid rgba(89,213,255,.22);min-width:0}
.cc-p h4{margin:0 0 8px;font:800 20px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:#fff}
.cc-p .empty{font:800 22px/1.05 var(--f-display);text-transform:uppercase;color:#cfe0ff;text-align:center;padding:14px 0}
.cc-p .nt{font-size:13px;border-left:3px solid var(--cy);padding:2px 8px;margin:0 0 6px;color:#e8f0ff}
.cc-ph{padding:0;position:relative;overflow:hidden;min-height:260px}
.cc-ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 40%;position:absolute;left:0;right:0;top:28px;bottom:0;height:auto}
.cc-ph .cap{position:absolute;left:0;right:0;top:0;padding:6px 8px;font-size:12px;background:linear-gradient(180deg,rgba(6,14,50,.9),rgba(6,14,50,0));color:#fff}
.cc-ph .cap i{display:inline-block;font-style:normal;font:700 10px var(--f-body);letter-spacing:.1em;background:#7b4dff;padding:1px 6px;margin-right:6px}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{font:700 11px var(--f-display);letter-spacing:.1em;color:#a9bdf5;text-align:right;padding:0 4px 4px}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb td{padding:5px 4px;text-align:right;border-top:1px solid rgba(255,255,255,.08);font-variant-numeric:tabular-nums}
.tb tr.me td{background:rgba(89,213,255,.18);font-weight:700}
.tb .tn{display:flex;align-items:center;gap:6px;text-align:left;min-width:0}
.tb .tn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
.cc-t{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc-t .cc-p{display:flex;flex-direction:column;gap:6px}
.cc-t b{font:800 22px/1 var(--f-display);text-transform:uppercase;color:#fff;letter-spacing:.03em}
.cc-t span{font-size:12px;color:#bcd0ff}
.cc-bar{height:6px;background:rgba(255,255,255,.15)}.cc-bar i{display:block;height:100%;background:var(--c,#59d5ff)}

.cc-h{font:700 13px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:#9fb4f0;margin:4px 2px 8px}
.cc .grid2 .btn{background:linear-gradient(160deg,#0d2a86,#081a5c);border-color:rgba(89,213,255,.22);color:#fff}
.cc .grid2 .btn .d{color:#b8c9f5}
.cc .grid2 .btn:disabled{opacity:.45}
.tgw{position:relative;border:1px solid var(--line);background:#0b1a12}
.tgw canvas{display:block;width:100%;height:auto;touch-action:none}
.tgov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(5,10,30,.72);text-align:center}
.tgov.on{display:flex}
.tgov b{font:800 40px var(--f-display);letter-spacing:.06em;color:#fff}
.tgov span{color:#cfe0ff}
.tgb{text-align:center!important;font:800 24px var(--f-display)!important;min-height:78px;background:linear-gradient(160deg,#1647d6,#0f2f9a)!important;color:#fff!important;touch-action:none;user-select:none}
.cinew{position:relative;margin:-4px -4px 0;border:1px solid var(--line);background:#000;overflow:hidden}
.cinew canvas{display:block;width:100%;height:auto;aspect-ratio:360/560}
.cinetag{position:absolute;left:10px;top:10px;font:800 14px var(--f-display);letter-spacing:.14em;background:rgba(0,0,0,.55);color:#fff;padding:4px 10px;border-radius:20px}
.cinecap{position:absolute;left:0;right:0;bottom:6px;padding:26px 16px 14px;font:600 18px/1.25 var(--f-body);color:#fff;text-align:center;background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,0));text-shadow:0 2px 6px #000;opacity:0}
.cinecap.in{animation:capin .5s forwards}
@keyframes capin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cinebar{position:absolute;left:0;right:0;top:0;height:4px;background:rgba(255,255,255,.2)}.cinebar i{display:block;height:100%;width:0;background:#f2c12e}

function afterWeek(){
  if(S.over)return ending();

  S.energy=clamp(S.energy+10,0,100);

function miniTable(){
  const c=CLUBS[S.club],o=S.opp,mt=S.ss.mt||0;
  const seed=n=>{let h=S.round*7+S.club;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;return h%100/100};
  const fill=(S.club>=4?OPP_EU:OPP_BR).filter(n=>n!==o.n).slice(0,2);
  const mk=(n,str,me,pts)=>({n,me,j:mt,pts:me?S.ss.pts:!mt?0:Math.max(0,Math.round(mt*(.6+str/60)+seed(n)*3-1.5))});
  const rows=[mk(c.n,c.str,true),mk(o.n,o.s,false),...fill.map(n=>mk(n,c.str,false))].sort((x,y)=>y.pts-x.pts);
  return `<table class="tb"><tr><th></th><th>J</th><th>PTS</th></tr>${rows.map((r,i)=>`<tr class="${r.me?'me':''}"><td><div class="tn"><span>${i+1}</span>${r.me?myCrest(16):opCrest(r.n,16)}<span>${esc(r.n)}</span></div></td><td>${r.j}</td><td>${r.pts}</td></tr>`).join('')}</table>`;
}
function pickEvent(){
  if(!chance(.5))return null;
  const list=EV.filter(e=>e.id!==S.lastEv&&(!e.min||S.age>=e.min)&&(!e.tier||S.club>=e.tier)&&(!e.when||e.when()));
  if(!list.length)return null;
  let r=Math.random()*list.reduce((s,e)=>s+(e.w||1),0);
  for(const e of list){r-=(e.w||1);if(r<=0){S.lastEv=e.id;return e}}
  return list[0];
}
function showEvent(ev,next){

}

function rollInjury(src){
  const r=Math.random();let w,n;
  if(r<.6){w=R(1,2);n=pick(['Entorse no tornozelo','Contusão na coxa','Dor muscular'])}
  else if(r<.9){w=R(3,5);n=pick(['Lesão muscular','Estiramento no posterior','Pubalgia'])}
  else{w=R(6,10);n=pick(['Ruptura de ligamento do joelho','Fratura no pé','Lesão no menisco'])}
  if(S.assets.includes('fisio'))w=Math.max(1,Math.ceil(w*.7));
  S.inj=w;S.injName=n;S.injSev=w>=6?2:w>=3?1:0;S.surg=false;
  fx({energy:-10,mood:-10});
  note(`<b>LESÃO (${src}):</b> ${n}. Fora por ${w} rodada(s).`);
  logL(`Lesão: ${n} (${w} rodadas).`);
  if(S.injSev===2){
    if(S.age>=29&&chance(.12))S.over='lesao';
    else{S.surg=true;if(chance(.5)){S.attrs.vel=Math.max(25,S.attrs.vel-2);note('A lesão deixa sequelas na sua velocidade.')}}
  }
}

}

  else if(kind==='ck'&&extra==='ala')t=pick([`O ponta do ${mn} vai à linha de fundo e levanta a cabeça. ${nm} se movimenta entre os zagueiros!`,`Jogada pela ponta! A bola vai ser cruzada na área e ${nm} ataca o espaço.`,`O lateral passa pelo marcador, chega à linha de fundo e cruza. ${nm} aparece na área!`]);

    if(b.k==='tackle'&&s===b.a&&def===b.tb)continue;
    if(def===b.ta&&s===b.a)continue;
    if(M.sim.out[def][s])continue;
    const d=Math.hypot(P[def][s][0]-ball.x,P[def][s][1]-ball.y);
    if(d<d1){d2=d1;c2=c1;d1=d;c1=s}else if(d<d2){d2=d;c2=s}
  }
  for(let t=0;t<2;t++)for(let s=0;s<11;s++){
    if(M.sim.out[t][s])continue;
    const p=P[t][s];
    let [tx,ty]=simHome(t,s,ball.x,ball.y),g=k,mx=13;
    const isA=b.a===s&&b.ta===t,isB=b.b===s&&b.tb===t&&b.b>=0&&b.k!=='tackle';
    const lock=b.ko||b.ghost||b.k==='corner'||b.ck||b.k==='set'||b.k==='off'||b.k==='throw';
    const RL=simRule(b,t,s,tx,ty,ball);
    if(RL){tx=RL[0];ty=RL[1];g=Math.min(1,dt*3.2)}
    if(b.ko){
      mx=22;g=Math.min(1,dt*9);
      if(isA){tx=ball.x;ty=ball.y;g=Math.min(1,dt*7);mx=22}
    }
    else if(b.k==='ht'||b.k==='end'){}
    else if(isA&&b.k!=='corner'){tx=ball.x;ty=ball.y;g=Math.min(1,dt*7);mx=17}
    else if(isB){tx=b.to[0];ty=b.to[1];g=Math.min(1,dt*5.5);mx=17}
    else if(t===def&&b.k!=='ht'&&b.k!=='end'&&!lock){
      if(s===c1){tx=ball.x;ty=ball.y;g=Math.min(1,dt*3.6);mx=15}
      else if(s===c2){tx=(ball.x*.55+tx*.45);ty=(ball.y*.55+ty*.45);g=Math.min(1,dt*3)}
    }
    if(b.k==='tackle'&&t===b.tb&&s===b.b){tx=ball.x;ty=ball.y;g=Math.min(1,dt*3)}
    if(b.k==='foul'&&(isA||(b.b===s&&b.tb===t))){tx=ball.x;ty=ball.y}
    /* a bola de corner: posição de cobrança */
    let dx=(tx-p[0])*g,dy=(ty-p[1])*g;
    const L=Math.hypot(dx,dy),cap=mx*dt;
    if(L>cap){dx*=cap/L;dy*=cap/L}
    p[0]+=dx;p[1]+=dy;
  }
}

  for(let i=1;i<=9;i++)if(i!==S.club&&CLUBS[i].need<=o&&(i>=S.club-1||S.age>=31))el.push(i);
  if(S.club===0&&!el.includes(1))el.push(1);
  el.sort((a,b)=>b-a);
  return el.slice(0,2).concat(el.slice(2).filter(()=>chance(.4)).slice(0,1))

function heroCut(v){

  HERO[key]='';
  if(!penGL())return '';

      const root=new N3(),p=v===0?mkPlayer(R,{kit:KIT_ME.kit,short:KIT_ME.short,sock:KIT_ME.sock,hair:KIT_ME.hair,skin:SKINS[0],num:{ATA:9,MEI:10,PON:11}[S&&S.pos]||9,hs:1,boot:'#f1f1f1',me:true}):mkPlayer(R,{kit:'#1f4fd8',short:'#16227a',sock:'#1f4fd8',hair:'#111',skin:SKINS[0],num:10,boot:'#f1f1f1'});

        p.root.r=[0,.18,0];V={eye:[0,1.02,4.7],tgt:[0,.96,0],fov:.58};
      }else{
        poseDribble(p,1.9,1);p.root.r=[0,-.75,0];
        const ball=root.add(new N3(R.mesh(gSph(.115,16,10)),{c:[.96,.96,.96],spec:.35,cast:true}));ball.p=[-.5,.115,.55];
        V={eye:[0,.98,4.7],tgt:[0,.9,0],fov:.58};
      }
      R.render(root,V);
      const c2=document.createElement('canvas');c2.width=W;c2.height=H;const g=c2.getContext('2d');g.drawImage(cv,0,0);
      pix.push(g.getImageData(0,0,W,H));
      const x=R.gl.getExtension('WEBGL_lose_context');if(x)x.loseContext();
    }
    const B=pix[0].data,Wd=pix[1].data,out=document.createElement('canvas');out.width=W;out.height=H;
    const og=out.getContext('2d'),im=og.createImageData(W,H),D=im.data;
    for(let i=0;i<D.length;i+=4){
      const d=((Wd[i]-B[i])+(Wd[i+1]-B[i+1])+(Wd[i+2]-B[i+2]))/3;let a=clamp(1-d/255,0,1);a=clamp((a-.5)/.4,0,1);a=a*a*(3-2*a);
      if(a<.03){D[i+3]=0;continue}

}

  S.lg.rounds[Math.min(S.round,S.lg.rounds.length-1)].forEach(([a,b])=>{
    const ex={g:mg||0,a:ma||0,rt:mrt||6,abs:!!abs};

function squadFor(club){
  if(SQUAD_REAL[club])return SQUAD_REAL[club].slice();
  let reg=null;
  const lgOf=Object.keys(LGPOOL).find(k=>LGPOOL[k].includes(club))||(CLUBS.find(c=>c.n===club)||{}).lg;
  const R2={'Série A':['BR'],'Série B':['BR'],'Sub-20':['BR'],'Várzea':['BR'],'Liga Lusa':['PT'],'Premier Isles':['EN'],'Calcio Nord':['IT'],'Liga Alpina':['DE'],'Liga Ibérica':['ES'],'Liga do Deserto':['AR']};
  if(lgOf)reg=R2[lgOf];
  else if(OPP_BR.includes(club))reg=['BR'];
  else if(CP_EU.includes(club))reg=['ES','EN','IT','DE','PT'];
  else if(CP_SA.includes(club))reg=['BR','ES'];
  else if(CP_AS.includes(club)||CP_OC.includes(club))reg=['AR','ES'];
  else if(club==='Seleção')reg=['BR'];
  else reg=['ES','EN','IT','DE','PT','BR'];
  const pool=[];reg.forEach(k=>NAMEPOOL[k].forEach(n=>pool.push(n)));
  const r=seedRnd(club+'#sq'),o=[];
  while(o.length<11&&pool.length){o.push(pool.splice(Math.floor(r()*pool.length),1)[0])}
  return o;
}

/* plano de lances: quantidade e minutos variam com a força dos times, posição, energia e minutos em campo */
function chancePlan(entry,cfg,cp){
  const on0=entry||5,ps={ATA:1.15,MEI:1.0,PON:.95}[S.pos]||1;
  const lam=((88-on0)/90)*3.1*clamp(1+(cfg.me-cfg.opp.s)/70,.6,1.5)*ps*(cp?1.12:1)*(.85+.3*S.energy/100)*(.8+Math.random()*.5);
  let k=Math.min(6,poisson(lam));
  if(!entry)k=Math.max(1,k);
  const t=[];
  for(let i=0;i<k;i++)t.push(on0+6+Math.random()*(88-on0-6));
  t.sort((a,b)=>a-b);
  const out=entry?[entry]:[];
  let last=entry?entry:0;
  t.forEach(x=>{let m=Math.round(Math.max(x,last+8));if(m<=88){out.push(m);last=m}});
  return out.length?out:[Math.round(on0+R(8,40))];
}

/* ---- transições de pose suaves: filtro nas articulações para o boneco não "pular" entre parado, corrida e chute ---- */
let POSE_IN=0;
function poseBlend(P){
  if(!P||!P.hips)return;
  const dt=(typeof P3o!=='undefined'&&P3o&&P3o.dt)||.016,k=1-Math.exp(-dt*26);
  const nodes=[P.hips,P.torso,P.head,P.sh[0],P.sh[1],P.el[0],P.el[1],P.th[0],P.th[1],P.kn[0],P.kn[1],P.ft[0],P.ft[1]];
  const pb=P._pb;
  if(!pb||pb.n!==nodes.length){P._pb={n:nodes.length,r:nodes.map(n=>n.r.slice()),h:[P.hips.p[0],P.hips.p[1]]};return}
  nodes.forEach((n,i)=>{const q=pb.r[i];for(let j=0;j<3;j++){let d=n.r[j]-q[j];if(Math.abs(d)>3.2)d-=Math.sign(d)*6.2832;q[j]+=d*k;n.r[j]=q[j]}});
  pb.h[0]+=(P.hips.p[0]-pb.h[0])*k;pb.h[1]+=(P.hips.p[1]-pb.h[1])*k;P.hips.p[0]=pb.h[0];P.hips.p[1]=pb.h[1];
}
['poseStand','poseRun','poseKick','poseRunKick','poseCele','poseCeleK','poseCrouch','poseJockey','poseStepOver','poseSlide','poseRef'].forEach(nm=>{

  window[nm]=function(P){POSE_IN++;let r;try{r=f.apply(this,arguments)}finally{POSE_IN--}if(!POSE_IN&&P&&P.hips)poseBlend(P);return r};
});
