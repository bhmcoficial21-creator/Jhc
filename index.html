<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0a07" />
  <title>Brass Brew · Doses e Drinks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body class="is-intro">
  <main class="home" id="home">
    <header class="home__top reveal">
      <span class="home__brand">Brass Brew</span>
      <span class="home__mesa">Mesa <b id="mesa">--</b></span>
    </header>

    <!-- Letreiro: na entrada fica no centro da tela; depois vira o destaque do início -->
    <section class="sign" id="sign" aria-label="Brass Brew, doses e drinks">
      <div class="sign__screen" id="screen">
        <div class="sign__pattern" aria-hidden="true"></div>
        <div class="sign__track" id="track" aria-hidden="true"></div>
        <div class="sign__bars" id="bars" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="sign__word" id="word" aria-hidden="true">Saúde!</div>
        <div class="sign__shine" aria-hidden="true"></div>
      </div>
    </section>

    <p class="home__hello reveal"><span id="greeting">Boa noite</span>! Bem-vindo à Casa das Caldeiras.</p>

    <section class="call reveal" id="call">
      <button class="btn-call" id="btnCall" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a1.5 1.5 0 0 1 1.5 1.5v.6A7 7 0 0 1 19 12v3.5l1.6 2.1a.9.9 0 0 1-.7 1.4H4.1a.9.9 0 0 1-.7-1.4L5 15.5V12a7 7 0 0 1 5.5-6.9v-.6A1.5 1.5 0 0 1 12 3Zm-2.4 17h4.8a2.4 2.4 0 0 1-4.8 0Z"/></svg>
        <span>Chamar garçom</span>
      </button>
      <div class="call__sent" id="callSent" hidden>
        <p class="call__title">Chamado enviado</p>
        <p class="call__text">O garçom já vai até a mesa <b class="js-mesa">--</b>.</p>
        <button class="btn-ghost" id="btnCancel" type="button">Cancelar chamado</button>
      </div>
    </section>

    <nav class="shortcuts reveal">
      <button class="shortcut" id="btnDrinks" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16l-7 8v6h3v2H8v-2h3v-6L4 4Zm4.4 2 3.6 4.1L15.6 6H8.4Z"/></svg>
        Ver drinks
      </button>
      <button class="shortcut" id="btnBill" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2Zm3 5v2h6V7H9Zm0 4v2h6v-2H9Z"/></svg>
        Pedir a conta
      </button>
    </nav>

    <footer class="home__legal reveal">
      Venda proibida para menores de 18 anos · Beba com moderação
    </footer>
  </main>


  <!-- Doses e Drinks: abas, busca, grade colorida e lista simples -->
  <section class="menu" id="menu" hidden>
    <header class="menu__top">
      <button class="icon-btn" id="menuBack" type="button" aria-label="Voltar ao início">←</button>
      <h1 class="menu__title">Doses &amp; Drinks</h1>
      <span class="bag" aria-label="Itens na sacola"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7V6a5 5 0 0 1 10 0v1h3l-1 14H5L4 7h3Zm2 0h6V6a3 3 0 0 0-6 0v1Z"/></svg><b class="js-bag" hidden>0</b></span>
    </header>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1 1 10 3Zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></svg>
      <input id="menuSearch" type="search" placeholder="Buscar drink ou ingrediente" autocomplete="off" />
    </label>
    <nav class="tabs" id="menuTabs" role="tablist" aria-label="Categorias"></nav>
    <div class="menu__content" id="menuContent"></div>
    <footer class="home__legal">Venda proibida para menores de 18 anos · Beba com moderação</footer>
  </section>

  <!-- Reels do drink: tela cheia, desliza para o próximo -->
  <section class="reel" id="reel" hidden>
    <header class="reel__top">
      <button class="icon-btn" id="reelClose" type="button" aria-label="Voltar para a lista">←</button>
      <span class="reel__cat" id="reelCat"></span>
      <span class="reel__count" id="reelCount"></span>
    </header>
    <div class="reel__track" id="reelTrack"></div>
  </section>

  <button class="skip" id="skip" type="button">Pular</button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="src/data.js"></script>
  <script src="src/vessel.js"></script>
  <script src="src/app.js"></script>
  <script src="src/cardapio.js"></script>
  <script>BB.route();</script>
</body>
</html>
