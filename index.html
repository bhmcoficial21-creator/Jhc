<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#a8361f" />
  <title>Brass Brew · Doses e Drinks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body class="is-intro">
  <main class="home" id="home">
    <!-- Capa: foto dos drinks, título grande e a aba da marca que abre o menu -->
    <section class="hero" aria-label="Brass Brew">
      <div class="hero__wall" aria-hidden="true"></div>
      <p class="hero__side hero__side--l">Casa das<br>Caldeiras</p>
      <p class="hero__side hero__side--r">Mesa<br><b id="mesa">—</b></p>
      <h1 class="hero__title" aria-label="Da caldeira pro seu copo">
        <span class="line"><span>Da caldeira</span></span>
        <span class="line"><span>pro seu</span></span>
        <span class="line"><span>copo</span></span>
      </h1>
      <div class="hero__drinks" aria-hidden="true">
        <img src="public/img/tangerina-spritz.webp" alt="" class="d d1" draggable="false">
        <img src="public/img/no-de-caju.webp" alt="" class="d d2" draggable="false">
        <img src="public/img/brasa.webp" alt="" class="d d3" draggable="false">
        <img src="public/img/veraneio.webp" alt="" class="d d4" draggable="false">
      </div>
    </section>

    <section class="actions">
      <button class="btn-main" id="btnDrinks" type="button">Ver drinks <span aria-hidden="true">→</span></button>
      <div class="actions__row" id="callRow">
        <button class="btn-line" id="btnCall" type="button">Chamar garçom</button>
        <button class="btn-line" id="btnBill" type="button">Pedir a conta</button>
      </div>
      <div class="call__sent" id="callSent" hidden>
        <p class="call__title">Garçom chamado</p>
        <p class="call__text">Já vai até a mesa <b class="js-mesa">—</b>.</p>
        <button class="btn-line" id="btnCancel" type="button">Cancelar chamado</button>
      </div>
      <p class="home__legal">Venda proibida para menores de 18 anos · Beba com moderação</p>
    </section>

    <!-- Aba da marca (pendurada no topo). Tocar abre o painel. -->
    <button class="brand-tab" id="brandTab" type="button" aria-expanded="false" aria-controls="panel">
      <span class="brand-tab__small">Cervejaria · Drinks</span>
      <span class="brand-tab__name">Brass<br>Brew</span>
      <span class="sr-only">Abrir menu</span>
    </button>

    <nav class="panel" id="panel" aria-label="Menu">
      <p class="panel__intro" aria-hidden="true"><span>Brass</span><span>Brew</span><small>Doses &amp; Drinks</small></p>
      <ul class="panel__list" id="panelList"></ul>
      <div class="panel__foot">
        <button class="panel__link" type="button" data-act="call">Chamar garçom</button>
        <button class="panel__link" type="button" data-act="bill">Pedir a conta</button>
      </div>
    </nav>
  </main>


  <!-- Doses e Drinks: abas, busca, grade colorida e lista simples -->
  <section class="menu" id="menu" hidden>
    <header class="menu__top">
      <button class="icon-btn" id="menuBack" type="button" aria-label="Voltar ao início">←</button>
      <h1 class="menu__title">Doses &amp; Drinks</h1>
      <span class="bag" aria-label="Itens na sacola"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7V6a5 5 0 0 1 10 0v1h3l-1 14H5L4 7h3Zm2 0h6V6a3 3 0 0 0-6 0v1Z"/></svg><b class="js-bag" hidden>0</b></span>
    </header>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1 1 10 3Zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></svg>
      <input id="menuSearch" type="search" placeholder="Buscar drink ou ingrediente" autocomplete="off" />
    </label>
    <nav class="tabs" id="menuTabs" role="tablist" aria-label="Categorias"></nav>
    <div class="menu__content" id="menuContent"></div>
    <footer class="home__legal">Venda proibida para menores de 18 anos · Beba com moderação</footer>
  </section>

  <!-- Reels do drink: tela cheia, desliza para o próximo -->
  <section class="reel" id="reel" hidden>
    <header class="reel__top">
      <button class="icon-btn" id="reelClose" type="button" aria-label="Voltar para a lista">←</button>
      <span class="reel__cat" id="reelCat"></span>
      <span class="reel__count" id="reelCount"></span>
    </header>
    <div class="reel__track" id="reelTrack"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="src/data.js"></script>
  <script src="src/vessel.js"></script>
  <script src="src/app.js"></script>
  <script src="src/cardapio.js"></script>
  <script>BB.route();</script>
</body>
</html>
