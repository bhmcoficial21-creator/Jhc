<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Barbe Skin</title>
  <meta name="theme-color" content="#0f2147">
  <link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="page-loader" id="pageLoader" role="progressbar" aria-label="Carregando o site" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="cut-reveal" aria-hidden="true">
      <img src="img/dono-poltrona.jpg" alt="">
      <div class="reveal-cap"><small>Fundador &amp; barbeiro</small><strong>Messin do Corte</strong></div>
    </div>
    <div class="cut-half cut-left" aria-hidden="true"><span class="wood"></span></div>
    <div class="cut-half cut-right" aria-hidden="true"><span class="wood"></span></div>
    <canvas class="embers" id="embers" aria-hidden="true"></canvas>
    <span class="cut-line" aria-hidden="true"></span>
    <div class="tesoura-wrap" aria-hidden="true"><svg class="tesoura" viewBox="0 0 200 430" aria-hidden="true">
        <defs>
          <linearGradient id="aco" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#3b4249"/><stop offset=".28" stop-color="#c9d0d7"/><stop offset=".42" stop-color="#ffffff"/>
            <stop offset=".58" stop-color="#9aa3ad"/><stop offset="1" stop-color="#2c3238"/>
          </linearGradient>
          <linearGradient id="cabo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4a4f56"/><stop offset=".35" stop-color="#16181b"/><stop offset=".7" stop-color="#2b2f34"/><stop offset="1" stop-color="#0b0c0e"/>
          </linearGradient>
          <radialGradient id="parafuso" cx=".35" cy=".3" r=".75">
            <stop offset="0" stop-color="#fff4cf"/><stop offset=".45" stop-color="#d8ad55"/><stop offset="1" stop-color="#6e4b17"/>
          </radialGradient>
          <filter id="somb" x="-30%" y="-10%" width="160%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".6"/></filter>
        </defs>
        <g filter="url(#somb)">
          <!-- metade A: argola esquerda + lâmina da direita -->
          <g class="tes-a">
            <path d="M93 168 C 97 240, 104 330, 109 418 L 113 412 C 121 322, 125 236, 121 172 Z" fill="url(#aco)" stroke="#20252a" stroke-width="1"/>
            <path d="M109 418 C 104 330, 97 240, 93 168" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.2"/>
            <path d="M121 172 C 112 140, 92 118, 78 98" fill="none" stroke="url(#cabo)" stroke-width="15" stroke-linecap="round"/>
            <circle cx="58" cy="66" r="38" fill="none" stroke="url(#cabo)" stroke-width="13"/>
            <circle cx="58" cy="66" r="38" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2" stroke-dasharray="40 200" transform="rotate(-140 58 66)"/>
            <path d="M28 96 C 18 118, 22 138, 40 146" fill="none" stroke="url(#cabo)" stroke-width="9" stroke-linecap="round"/>
          </g>
          <!-- metade B: argola direita + lâmina da esquerda (espelhada) -->
          <g class="tes-b">
            <path d="M107 168 C 103 240, 96 330, 91 418 L 87 412 C 79 322, 75 236, 79 172 Z" fill="url(#aco)" stroke="#20252a" stroke-width="1"/>
            <path d="M91 418 C 96 330, 103 240, 107 168" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/>
            <path d="M79 172 C 88 140, 108 118, 122 98" fill="none" stroke="url(#cabo)" stroke-width="15" stroke-linecap="round"/>
            <circle cx="142" cy="66" r="38" fill="none" stroke="url(#cabo)" stroke-width="13"/>
            <circle cx="142" cy="66" r="38" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2" stroke-dasharray="40 200" transform="rotate(-40 142 66)"/>
          </g>
          <!-- parafuso dourado -->
          <circle cx="100" cy="170" r="11" fill="url(#parafuso)" stroke="#4a3210" stroke-width="1.5"/>
          <path d="M93 167 L107 173" stroke="#4a3210" stroke-width="2.4" stroke-linecap="round"/>
        </g>
      </svg></div>
    <div class="ld-logo"><div class="logo3d" aria-hidden="true"><div class="l3-stage">
          <span class="l3-edge"></span>
          <img class="l3-base" src="img/logo3d/base.png" alt="">
          <img class="l3-ring" src="img/logo3d/ring.png" alt="">
          <img class="l3-poles" src="img/logo3d/poles.png" alt="">
          <img class="l3-msn" src="img/logo3d/msn.png" alt="">
          <img class="l3-chair" src="img/logo3d/chair.png" alt="">
          <span class="l3-crown"><span class="l3-crown-spin"><img src="img/logo3d/crown.svg" alt="" style="--k:0"><img src="img/logo3d/crown.svg" alt="" style="--k:1"><img src="img/logo3d/crown.svg" alt="" style="--k:2"><img src="img/logo3d/crown.svg" alt="" style="--k:3"><img src="img/logo3d/crown.svg" alt="" style="--k:4"><img src="img/logo3d/crown.svg" alt="" style="--k:5"><img src="img/logo3d/crown.svg" alt="" style="--k:6"><img src="img/logo3d/crown.svg" alt="" style="--k:7"></span></span>
          <span class="l3-shine"></span>
        </div></div></div>
    <div class="ld-ui">
      <p class="ld-kicker" id="ldKicker">Preparando a cadeira</p>
      <p class="ld-pct"><span id="loaderPct">0</span>%</p>
      <div class="pole-h" aria-hidden="true">
          <span class="ph-knob ph-knob-l"></span><span class="ph-cap ph-cap-l"></span>
          <span class="ph-tube"><span class="ph-fill" id="loaderBar"><span class="ph-stripes"></span></span><span class="ph-glass"></span></span>
          <span class="ph-cap ph-cap-r"></span><span class="ph-knob ph-knob-r"></span>
        </div>
    </div>
  </div>
  <a href="index.html" class="auth-back">← Voltar ao site</a>
  <main class="auth-wrap">
    <section class="auth-card" aria-labelledby="authTitle">
      <div class="auth-logo" aria-hidden="true"><img src="img/logo-messin.png" alt=""></div>
      <h1 id="authTitle">Bem-vindo de volta</h1>
      <p class="auth-sub" id="authSub">Entre para agendar na Barbe Skin</p>

      <div class="auth-tabs" role="tablist">
        <button type="button" role="tab" class="auth-tab is-active" data-perfil="cliente" aria-selected="true">Sou cliente</button>
        <button type="button" role="tab" class="auth-tab" data-perfil="barbeiro" aria-selected="false">Sou barbeiro</button>
      </div>

      <form id="barbForm" class="auth-form" novalidate hidden>
        <div class="barb-pick" id="barbPick" role="radiogroup" aria-label="Quem é você"></div>
        <label class="auth-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input name="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Senha da agenda" aria-label="Senha da agenda">
        </label>
        <label class="check"><input type="checkbox" name="lembrar" checked> Manter conectado neste celular</label>
        <p class="auth-msg" id="barbMsg" role="alert"></p>
        <button type="submit" class="auth-submit">Abrir minha agenda <span aria-hidden="true">→</span></button>
      </form>

      <form id="authForm" class="auth-form" novalidate>
        <label class="auth-field" data-only="cadastro">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <input name="nome" autocomplete="name" placeholder="Nome completo" aria-label="Nome completo">
        </label>
        <label class="auth-field" data-only="cadastro">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
          <input name="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="WhatsApp com DDD" aria-label="WhatsApp">
        </label>
        <label class="auth-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input name="email" type="email" autocomplete="email" placeholder="E-mail" aria-label="E-mail">
        </label>
        <label class="auth-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input name="senha" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha">
          <button type="button" class="eye" id="eye" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </label>

        <div class="auth-row" data-only="login">
          <label class="check"><input type="checkbox" name="lembrar" checked> Lembrar de mim</label>
          <button type="button" class="auth-link" id="esqueci">Esqueci a senha</button>
        </div>

        <p class="auth-msg" id="authMsg" role="alert"></p>
        <button type="submit" class="auth-submit" id="authSubmit">Entrar <span aria-hidden="true">→</span></button>
      </form>

      <div class="auth-or"><span>ou</span></div>
      <button type="button" class="auth-google" id="google">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3Z"/><path fill="#fff" opacity=".85" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.800-5.600-4.100H3.1v2.6A10 10 0 0 0 12 22Z"/><path fill="#fff" opacity=".7" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14Z"/><path fill="#fff" opacity=".55" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6Z"/></svg>
        Entrar com Google
      </button>

      <p class="auth-switch" id="authSwitch"></p>
    </section>
  </main>
  <script src="js/logo3d.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/entrar.js"></script>
</body>
</html>
